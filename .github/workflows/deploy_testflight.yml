name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'sync_service/**'
      - '.gitignore'

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Setup Ruby and install Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # 4. Prepare Flutter build directories & config
      - name: Configure Flutter & Prepare Build Directories
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages

      # 5. Install Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 6. Pre-compile Flutter iOS Release bundle (increments build number automatically)
      - name: Precompile Flutter iOS
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # 7. Setup Keychain & Install Apple Distribution Certificate + WWDR CAs
      - name: Install Apple Certificate and WWDR CA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PASSWORD=temporary_build_password
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          # 2. Download and import Apple Worldwide Developer Relations (WWDR) Intermediate Certificates
          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o /tmp/AppleWWDRCAG6.cer
          security import /tmp/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import /tmp/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # 3. Decode and import the Distribution Certificate (.p12)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/dist_cert.p12
          security import /tmp/dist_cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # 4. Allow codesign access without popup dialogs
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 5. Set keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 6. Verify valid identities
          security find-identity -v -p codesigning

      # 8. Sign and Upload to TestFlight via Fastlane
      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta

      # 8. Upload the signed IPA as a downloadable artifact (backup)
      - name: Upload Signed IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliteLiving-Signed-IPA
          path: build/ios/ipa/EliteLiving.ipa
          retention-days: 14
