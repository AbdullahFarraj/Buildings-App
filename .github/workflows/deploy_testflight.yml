name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'sync_service/**'
      - '.gitignore'

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1.5. Select Xcode 16+ (Required by App Store Connect for iOS 18 SDK)
      - name: Select Xcode 16+
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 2. Setup Keychain & Install Apple Distribution Certificate + WWDR CAs (Fast-fail in 5s)
      - name: Install Apple Certificate and WWDR CA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PASSWORD=temporary_build_password
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          # 2. Download and import Apple Worldwide Developer Relations (WWDR) Intermediate Certificates
          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o /tmp/AppleWWDRCAG6.cer
          security import /tmp/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import /tmp/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # 3. Decode and normalize the Distribution Certificate (.p12) for macOS Keychain
          CLEAN_PASS=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n ')
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/raw_cert.p12

          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          if [ ! -x "$OPENSSL_BIN" ]; then
            OPENSSL_BIN=$(which openssl)
          fi

          if "$OPENSSL_BIN" pkcs12 -in /tmp/raw_cert.p12 -nodes -passin "pass:$CLEAN_PASS" -out /tmp/cert_bundle.pem 2>/dev/null || \
             "$OPENSSL_BIN" pkcs12 -legacy -in /tmp/raw_cert.p12 -nodes -passin "pass:$CLEAN_PASS" -out /tmp/cert_bundle.pem 2>/dev/null; then
            "$OPENSSL_BIN" pkcs12 -export -legacy -in /tmp/cert_bundle.pem -out /tmp/dist_cert.p12 -passout "pass:$CLEAN_PASS"
          else
            cp /tmp/raw_cert.p12 /tmp/dist_cert.p12
          fi

          security import /tmp/dist_cert.p12 -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security

          # 4. Allow codesign access without popup dialogs
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 5. Set keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 6. Verify valid identities
          security find-identity -v -p codesigning

      # 3. Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Setup Ruby and install Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # 5. Prepare Flutter build directories & config
      - name: Configure Flutter & Prepare Build Directories
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages

      # 6. Install Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 7. Configure Flutter iOS Release & CocoaPods (increments build number automatically)
      - name: Prepare Flutter iOS & Pods
        run: |
          flutter build ios --config-only --no-codesign --release --build-number=${{ github.run_number }}
          cd ios
          pod install

      # 8. Sign and Upload to TestFlight via Fastlane
      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta

      # 8. Upload the signed IPA as a downloadable artifact (backup)
      - name: Upload Signed IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliteLiving-Signed-IPA
          path: build/ios/ipa/EliteLiving.ipa
          retention-days: 14
