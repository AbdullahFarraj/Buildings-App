name: Build Android (APK & App Bundle)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'sync_service/**'
      - '.gitignore'

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17 for Android Gradle build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build Android App Bundle (Google Play Release)
      - name: Build Release App Bundle
        run: flutter build appbundle --release

      # 6. Build Android APK (Release)
      - name: Build Release APK
        run: flutter build apk --release

      # 7. Upload App Bundle Artifact (for Google Play Console)
      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binshafar-Properties-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # 8. Upload APK Artifact (for direct testing)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binshafar-Properties-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
